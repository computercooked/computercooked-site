# Site checks on every pull request and push to main (audit P1 #27). Runs the Worker locally (wrangler dev, local
# D1, a throwaway admin token) and checks it three ways:
#   1. scripts/smoke-test.mjs: the API end to end, accounts included (local only, by the script's own rule)
#   2. Lighthouse (mobile): performance >= 85 and accessibility >= 90 on the landing, hub and two games
#   3. scripts/page-check.mjs: landing, hub, daily 3 and every game page at 390 and 1280 wide, no console errors,
#      screenshots kept as an artifact for eyeballing (pixel-diff baselines are a later step)
# Nothing here deploys; Cloudflare Workers Builds still deploys main as before.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: start the site locally
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "ADMIN_TOKEN=$TOKEN" > .dev.vars
          echo "ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          npx --yes wrangler@4 dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/api/health
      - name: API smoke test
        run: node scripts/smoke-test.mjs http://127.0.0.1:8787 "$ADMIN_TOKEN"
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.github/lighthouserc.json
      - name: pages at 390 and 1280
        run: |
          npm i --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          node scripts/page-check.mjs http://127.0.0.1:8787
      - name: keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks
          path: |
            dist/page-check/
            .lighthouseci/
            wrangler.log
          if-no-files-found: ignore
