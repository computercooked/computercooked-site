<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="description" content="goose court: a goose is on trial and you are the judge. guilty if the beak holds the evidence. the goose has a lawyer. from computer cooked games.">
<title>goose court · computer cooked games</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e0f11; overflow: hidden; }
  body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #mute { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 2; background: rgba(0,0,0,.45); color: #c9c4a8; border: 1px solid #3a3d33; font: 700 12px ui-monospace, Menlo, Consolas, monospace; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
  /* K-0059: shared tip button (assets/tip.js): game.js shows this box just under the game-over card */
  #cc-tip-box { position: fixed; left: 0; right: 0; z-index: 3; display: flex; justify-content: center; padding: 0 12px; color: #c9c4a8; pointer-events: none; }
  #cc-tip-box[hidden] { display: none; }
  #cc-tip-box .cc-tipjar { margin: 0; pointer-events: none; }
  #cc-tip-box .cc-tipjar a { pointer-events: auto; }
</style>
<script src="/games/cc-sdk.js"></script>
<script src="/assets/tip.js" defer></script>
</head>
<body>
<canvas id="c" aria-label="goose court game: a goose is on trial. guilty if its beak holds the item it is charged with. swipe or tap guilty or not guilty."></canvas>
<button id="mute" type="button" aria-label="mute">sound on</button>
<script src="game.js"></script>
</body>
</html>
