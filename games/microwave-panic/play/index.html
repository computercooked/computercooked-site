<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="description" content="microwave panic: hold to cook, let go when it is done. read the popcorn, the egg, the burrito. never microwave the fork. from computer cooked games.">
<title>microwave panic · computer cooked games</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e0f11; overflow: hidden; }
  body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  /* K-0060: a touch hold is a hold: no scroll/zoom, no long-press callout, no selection */
  canvas { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #haunt { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 2; background: rgba(0,0,0,.45); color: #ff9a2e; border: 1px solid #5a3a1e; font: 700 12px ui-monospace, Menlo, Consolas, monospace; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
  #haunt[hidden] { display: none; }
  #mute { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 2; background: rgba(0,0,0,.45); color: #c9c4a8; border: 1px solid #3a3d33; font: 700 12px ui-monospace, Menlo, Consolas, monospace; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
  /* K-0059: shared tip button (assets/tip.js): game.js shows this box just under the game-over card */
  #cc-tip-box { position: fixed; left: 0; right: 0; z-index: 3; display: flex; justify-content: center; padding: 0 12px; color: #c9c4a8; pointer-events: none; }
  #cc-tip-box[hidden] { display: none; }
  #cc-tip-box .cc-tipjar { margin: 0; pointer-events: none; }
  #cc-tip-box .cc-tipjar a { pointer-events: auto; }
  /* review16 r4: "dare a friend" on the end card; game.js places it and sets its text */
  #mp-share { position: fixed; left: 50%; transform: translateX(-50%); z-index: 3; min-height: 44px; max-width: calc(100% - 24px); padding: 0 18px; border-radius: 999px; border: 2px solid #0b0c0e; background: #a8d533; color: #0b0c0e; font: 800 15px ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 3px 0 #0b0c0e; touch-action: manipulation; }
  #mp-share:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 1px 0 #0b0c0e; }
  #mp-share[hidden] { display: none; }
</style>
<script src="/games/cc-sdk.js"></script>
<script src="/assets/tip.js" defer></script>
</head>
<body>
<canvas id="c" aria-label="microwave panic game: hold anywhere to run the microwave, let go when the food is done. burnt food is a strike."></canvas>
<button id="mute" type="button" aria-label="mute">sound on</button>
<button id="mp-share" type="button" hidden>dare a friend ↗</button>
<button id="haunt" type="button" hidden>🎃 haunted: off</button>
<script src="game.js"></script>
</body>
</html>
