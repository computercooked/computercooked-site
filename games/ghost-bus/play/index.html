<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ghost bus · computer cooked</title>
<meta name="description" content="drive the last bus through a haunted town. draw the route, pick up the ghosts, drop them off before dawn. some of them hate each other.">
<link rel="stylesheet" href="style.css">
<script src="/games/cc-sdk.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="mapBtn" class="tb" aria-label="town map"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <div id="lvl"><span id="lvNum">1-1</span><span id="lvName">first stop</span></div>
    <div id="lvStars"></div>
    <button id="hintBtn" class="tb" aria-label="driver's notes (hint)">?</button>
    <button id="muteBtn" class="tb" aria-label="sound on or off"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="muteWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="muteX" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="note" class="hide"></div>
    <div id="toast" class="hide"></div>
    <div class="credit">computer cooked games</div>
  </div>
  <footer id="bot">
    <button id="undoBtn" class="bb" aria-label="undo last street"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>undo</span></button>
    <button id="clearBtn" class="bb" aria-label="clear route"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>clear</span></button>
    <div id="meter">
      <div id="mTxt"><b id="mLen">0</b><span id="mOf">/12 streets</span><span id="mPar">par 9</span></div>
      <div id="mBar"><div id="mFill"></div><i id="mParTick"></i><span class="moon"></span><span class="sun"></span></div>
    </div>
    <button id="goBtn" class="go">go</button>
  </footer>
  <div id="mapScr" class="hide">
    <div id="mapInner">
      <div id="mapHead"><canvas id="logo" width="320" height="120"></canvas><div id="mapTot"></div></div>
      <button id="contBtn" class="cont"></button>
      <button id="dailyBtn" class="daily"></button>
      <div id="hoods"></div>
      <div class="mapFoot">computer cooked games · ghost bus</div>
    </div>
  </div>
  <div id="modal" class="hide"><div id="card"></div></div>
  <div id="pauseOv" class="hide"><div>paused<br><small>tap to keep driving</small></div></div>
</div>
<script src="/assets/tip.js" defer></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
