<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>overdue notice · computer cooked games</title>
<meta name="description" content="smash popups for cash. pay rent before the debt collector gets here. an incremental about being broke.">
<link rel="stylesheet" href="style.css">
<script src="/games/cc-sdk.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row1">
      <div id="cash">$0</div>
      <div id="clock"><span id="day">day 1</span><span id="time">8:00am</span></div>
      <button id="spooky" class="chip" title="halloween mode">🎃</button>
    </div>
    <div id="dayBar"><i></i></div>
    <div id="lane" title="debt collector">
      <span id="collector">🕴️</span><span id="door">🚪</span>
      <span id="laneText">debt collector: nowhere near you</span>
    </div>
  </header>
  <main id="field" aria-label="desktop. tap popups and piggy banks for cash.">
    <div id="status"></div>
    <div id="hint">tap popups for cash. smash the piggy. pay your bills.</div>
    <div id="credit">computer cooked games</div>
  </main>
  <section id="panel">
    <nav id="tabs">
      <button data-tab="bills" class="on">bills <b id="billBadge"></b></button>
      <button data-tab="hustles">hustles</button>
      <button data-tab="upgrades">upgrades</button>
      <button data-tab="fresh">fresh start</button>
    </nav>
    <div id="list"></div>
  </section>
</div>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast" hidden></div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
