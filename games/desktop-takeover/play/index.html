<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1030">
<meta name="description" content="desktop takeover: you are a rogue folder. spawn cursors, drag them at other folders and take the whole desktop from the bot programs. empty the bin on them once. from computer cooked games.">
<title>desktop takeover · computer cooked games</title>
<style>
  @font-face { font-family: "Pixelify"; src: url("/assets/fonts/pixelify-sans-latin-wght.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  * { box-sizing: border-box; }
  :root { --beige: #e6d9b4; --beige2: #cbbd92; --beige3: #a8996a; --ink: #14140f; --lime: #b6ff3c; --lime2: #4f7d10; --red: #d42b2b; --bg: #0d1030; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 600 15px/1.35 "Pixelify", ui-monospace, Menlo, Consolas, monospace; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  #menu { position: fixed; left: calc(8px + env(safe-area-inset-left, 0px)); top: calc(6px + env(safe-area-inset-top, 0px)); z-index: 3; width: 34px; height: 28px; padding: 0; line-height: 22px; font-size: 16px; }
  #menu[hidden] { display: none; }
  .btn { padding: 8px 14px; background: var(--beige); border: 2px solid var(--ink); box-shadow: inset -2px -2px 0 var(--beige3), inset 2px 2px 0 #fff8e0; font-weight: 700; }
  .btn:active { box-shadow: inset 2px 2px 0 var(--beige3), inset -2px -2px 0 #fff8e0; }
  .btn.go { background: #d3f59a; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .over { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; padding: calc(60px + env(safe-area-inset-top, 0px)) 16px 18px 12px; background: radial-gradient(ellipse at 50% 30%, #1a1f5ccc, #0d1030ee 75%); overflow: auto; touch-action: pan-y; scrollbar-width: none; }
  .over::-webkit-scrollbar { display: none; }
  .over[hidden] { display: none; }
  #title.over { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .card { width: min(100%, 430px); margin: auto; background: var(--beige); border: 2px solid var(--ink); box-shadow: inset -3px -3px 0 var(--beige3), inset 3px 3px 0 #fff8e0, 8px 8px 0 #0009; text-align: center; }
  .card .tb { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: linear-gradient(90deg, #2a2f8a, #5a3fb0); color: #f4f4ff; font-size: 13px; text-align: left; }
  .card .tb b { flex: 1; font-weight: 700; }
  .card .tb i { width: 16px; height: 14px; background: var(--beige); border: 1px solid var(--ink); font-style: normal; color: var(--ink); font-size: 10px; line-height: 12px; text-align: center; }
  .card .in { padding: 12px 14px 14px; }
  .card h1 { margin: 0 0 4px; font-size: clamp(28px, 8.5vw, 40px); line-height: 1; letter-spacing: -.5px; }
  .card h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.1; }
  .card h2 em { font-style: normal; color: var(--lime2); }
  .card h2.lost em { color: var(--red); }
  .card p { margin: 5px 0; font-weight: 500; }
  .card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .card .big { font-size: 17px; padding: 10px 16px; }
  .card .small { font-size: 12px; opacity: .78; }
  .card .lab { margin: 10px 0 4px; font-size: 11px; letter-spacing: 1.5px; opacity: .7; text-transform: uppercase; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lv .btn { padding: 6px 2px 4px; font-size: 18px; line-height: 1.05; }
  .lv .btn small { display: block; font-size: 10px; letter-spacing: 1px; color: #7a5a00; min-height: 12px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .modes .btn { padding: 8px 6px; font-size: 15px; line-height: 1.15; }
  .modes .btn small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
  .risk { color: var(--red); font-weight: 700; }
  .stars { font-size: 26px; letter-spacing: 4px; line-height: 1; color: #c98a00; }
  .stars s { text-decoration: none; opacity: .25; }
  .card img.share { width: auto; max-width: 100%; max-height: max(84px, calc(100vh - 470px)); height: auto; display: block; border: 2px solid var(--ink); margin: 6px auto 2px; }
  .card .note { margin: 6px 0 0; font-size: 14px; font-weight: 700; color: var(--lime2); }
  .card .note:empty { display: none; }
  .card .note.flash { animation: noteIn .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes noteIn { from { transform: scale(.7); opacity: 0; } }
  .btn.nope { animation: nope .35s; }
  @keyframes nope { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  #tipSlot .cc-tipjar { margin-top: 10px; }
  @media (max-height: 640px) {
    .over { padding-top: calc(52px + env(safe-area-inset-top, 0px)); padding-bottom: 14px; }
    #title.over { padding-top: 8px; padding-bottom: 8px; }
    .card .in { padding: 8px 12px 10px; }
    .card h1 { font-size: clamp(24px, 7.5vw, 32px); }
    .card h2 { font-size: 20px; margin: 0 0 2px; }
    .card p { margin: 3px 0; font-size: 13px; }
    .card .row { margin-top: 6px; }
    .card .big { font-size: 15px; padding: 7px 12px; }
    .card .lab { margin: 6px 0 3px; }
    .stars { font-size: 20px; }
    #tipSlot .cc-tipjar { margin-top: 6px; }
  }
  @media (max-height: 500px) {
    .card img.share { display: none; }
    .card .btn { padding-top: 5px; padding-bottom: 5px; }
    .lv .btn { font-size: 15px; }
    .card .hide-short { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .card .note.flash, .btn.nope { animation: none; } }
</style>
<script src="/games/cc-sdk.js"></script>
<script src="/assets/tip.js" defer></script>
</head>
<body>
<canvas id="cv" role="img" aria-label="a cooked computer desktop covered in folders. drag from your green folders to other folders to send cursors and take them over."></canvas>
<button class="btn" id="menu" type="button" aria-label="back to the menu" hidden>≡</button>
<div class="over" id="title"><div class="card"><div class="tb"><b>takeover.exe</b><i>_</i><i>×</i></div><div class="in" id="titleIn"></div></div></div>
<div class="over" id="end" hidden><div class="card"><div class="tb"><b id="endTb">results.txt</b><i>_</i><i>×</i></div><div class="in" id="endIn"></div></div></div>
<script src="game.js"></script>
</body>
</html>
