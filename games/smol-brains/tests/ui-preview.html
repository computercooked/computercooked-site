<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>smol brains · ui preview (stub harness)</title>
<link rel="stylesheet" href="../play/style.css">
<!-- Stub harness for ui.js: fake Game/World/Render/Creature/Brain/Chem/Save/Audio, just enough to
     render every panel and modal. Open with ?tut=1 to start in the tutorial, ?empty=1 for no smols. -->
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"></div>
<script src="../play/js/core.js"></script>
<script src="../play/js/genome.js"></script>
<script>
(function () {
  "use strict";
  var SB = window.SB;
  var qs = new URLSearchParams(location.search);
  var rng = SB.rng(42);

  /* ---------- fake brain ---------- */
  function fakeBrain(nHid) {
    var nIn = 45, nOut = 12;
    var b = { nIn: nIn, nHid: nHid, nOut: nOut, w1: new Float32Array(nHid * nIn), w2: new Float32Array(nOut * nHid),
      b1: new Float32Array(nHid), b2: new Float32Array(nOut), att: new Float32Array(16 * 13),
      x: new Float32Array(nIn), h: new Float32Array(nHid), q: new Float32Array(nOut),
      dw1: new Float32Array(nHid * nIn), dw2: new Float32Array(nOut * nHid), updates: 137, lastErr: 0.31, lastVerb: 2 };
    for (var i = 0; i < b.w1.length; i++) b.w1[i] = rng.gauss() * 0.5;
    for (var j = 0; j < b.w2.length; j++) b.w2[j] = rng.gauss() * 0.6;
    for (var k = 0; k < b.att.length; k++) b.att[k] = rng.gauss() * 0.6;
    for (var f = 0; f < 30; f++) b.dw1[rng.int(b.dw1.length)] = rng() * 0.05;
    for (var f2 = 0; f2 < 10; f2++) b.dw2[rng.int(b.dw2.length)] = rng() * 0.05;
    return b;
  }
  function forward(b, drives, noun, heard) {
    b.x.fill(0);
    for (var d = 0; d < 12; d++) b.x[d] = drives[d];
    if (noun >= 0) b.x[12 + noun] = 1;
    if (heard >= 0) b.x[28 + heard] = 1;
    b.x[41] = 1; b.x[44] = 1;
    for (var j = 0; j < b.nHid; j++) { var s = 0; for (var i = 0; i < b.nIn; i++) s += b.w1[j * b.nIn + i] * b.x[i]; b.h[j] = Math.tanh(s); }
    for (var k = 0; k < b.nOut; k++) { var t = 0; for (var jj = 0; jj < b.nHid; jj++) t += b.w2[k * b.nHid + jj] * b.h[jj]; b.q[k] = Math.tanh(t) * 0.9; }
    b.q[2] = 0.71;
  }

  /* ---------- fake creatures ---------- */
  var nextId = 1;
  function mk(species, name, x, opts) {
    opts = opts || {};
    var g = SB.Genome.random(rng, { species: species });
    if (opts.mut) g.mutated = ["ears", "new instinct: bored + ball → play"];
    var nH = SB.Genome.nHid(g);
    var c = { id: nextId++, species: species, name: name, gen: opts.gen || 1, parents: opts.parents || [], born: 0, age: opts.age || 400, stage: opts.stage != null ? opts.stage : 1, alive: true,
      genome: g, look: SB.Genome.look(g), brain: fakeBrain(nH), x: x, y: 470, vx: 0, vy: 0,
      chem: { glucose: 0.4, fat: 0.2, reward: 0.12, punish: 0.02, adrenaline: 0, toxin: 0, antigen: 0.05, antibody: 0.1, medicine: 0, health: opts.health || 0.86 },
      attn: { type: "object", id: 99, noun: "food" }, action: { verb: species === "grump" ? "hit" : "eat" }, asleep: false,
      vocab: opts.vocab || {}, lastReward: 0.6, heldBy: null };
    SB.DRIVES.forEach(function (d) { c.chem[d] = rng() * 0.6; });
    c.chem.hunger = 0.78;
    forward(c.brain, SB.DRIVES.map(function (d) { return c.chem[d]; }), 3, opts.heard != null ? opts.heard : -1);
    return c;
  }

  var empty = qs.get("empty") === "1";
  var creatures = empty ? [] : [
    mk("smol", "Bobo", 2300, { vocab: { food: 1.3, eat: 1.05, ball: 0.6, good: 0.4, hungry: 0.2, Bobo: 1.2 }, stage: 1, age: 520 }),
    mk("smol", "Kiki", 2500, { vocab: { food: 0.4 }, stage: 0, age: 90, heard: 2 }),
    mk("smol", "Wizzleppy", 2700, { stage: 3, age: 1600, gen: 2, mut: true, health: 0.3 }),
    mk("grump", "grump", 600, { stage: 3 })
  ];
  if (!empty) { creatures[2].parents = [creatures[0].id, creatures[1].id]; }

  var family = {};
  creatures.filter(function (c) { return c.species === "smol"; }).forEach(function (c) {
    family[c.id] = { id: c.id, name: c.name, gen: c.gen, parents: c.parents.slice(), kids: [], born: 0, died: null, look: c.look };
  });
  // some dead ancestors and more kids
  if (!empty) {
    var anc = mk("smol", "Oldmo", 0, { stage: 4 }); family[anc.id] = { id: anc.id, name: "Oldmo", gen: 1, parents: [], kids: [creatures[2].id], born: 0, died: 900, cause: "old age", look: anc.look };
    family[creatures[0].id].kids.push(creatures[2].id); family[creatures[1].id].kids.push(creatures[2].id);
    for (var g3 = 0; g3 < 3; g3++) { var kid = mk("smol", ["Pibble", "Zux", "Moffle"][g3], 0, { gen: 3 }); family[kid.id] = { id: kid.id, name: kid.name, gen: 3, parents: [creatures[2].id, anc.id], kids: [], born: 10 + g3, died: g3 === 1 ? 1200 : null, cause: "grump", look: kid.look }; family[creatures[2].id].kids.push(kid.id); }
  }

  var objects = [
    { id: 900, kind: "egg", noun: "egg", x: 2250, y: 455, r: 13, data: { starter: true } },
    { id: 901, kind: "apple", noun: "food", x: 2420, y: 462, r: 11 },
    { id: 902, kind: "appletree", noun: "plant", x: 2100, y: 400, r: 30, fixed: true },
    { id: 903, kind: "ball", noun: "ball", x: 2600, y: 458, r: 13 },
    { id: 904, kind: "warpgate", noun: "gadget", x: 3050, y: 440, r: 26, fixed: true }
  ];

  var game = {
    v: 1, seed: 42, time: 1.4 * SB.DAY_LENGTH, speed: 1, rng: rng, nextId: 1000,
    world: { objects: objects, weather: { kind: qs.get("wx") || "rain" }, light: 0.8 },
    creatures: creatures, selectedId: null,
    hand: { x: 2300, y: 300, visible: false, tool: "grab", heldId: null, saying: null, sayT: 0 },
    family: family,
    stats: { hatched: 3, eggsLaid: 1, maxGen: 3, wordsTaught: 4, tickles: 2, taps: 0, deaths: 1, bestIQ: 87, grumpNights: 1, cured: 0, imported: 0, exported: 0 },
    achievements: { hatch: Date.now(), name: Date.now(), feed: Date.now(), tickle: Date.now(), word1: Date.now(), brain: Date.now(), egg: Date.now() },
    tutorial: { step: 0, done: qs.get("tut") !== "1", firstWord: false },
    log: []
  };

  /* ---------- stub modules ---------- */
  var cam = { x: 2450, y: 300, zoom: 1, follow: null };
  var view = document.getElementById("view");
  function vw() { return view.clientWidth; } function vh() { return view.clientHeight; }
  function scale() { return Math.max(0.5, vh() / 600) * cam.zoom; }
  SB.Render = {
    camera: cam,
    toWorld: function (sx, sy) { var s = scale(); return { x: cam.x + (sx - vw() / 2) / s, y: cam.y + (sy - vh() / 2) / s }; },
    toScreen: function (wx, wy) { var s = scale(); return { x: (wx - cam.x) * s + vw() / 2, y: (wy - cam.y) * s + vh() / 2 }; },
    panBy: function (dx, dy) { var s = scale(); cam.x -= dx / s; cam.y -= dy / s; },
    zoomAt: function (sx, sy, f) { cam.zoom = SB.clamp(cam.zoom * f, 0.5, 2.5); },
    centerOn: function (x) { cam.x = x; },
    pick: function (g, sx, sy) {
      var p = SB.Render.toWorld(sx, sy);
      for (var i = 0; i < creatures.length; i++) { var c = creatures[i]; if (SB.dist(p.x, p.y, c.x, c.y - 20) < 30) return { type: "creature", ref: c }; }
      for (var j = 0; j < objects.length; j++) { var o = objects[j]; if (SB.dist(p.x, p.y, o.x, o.y) < o.r + 10) return { type: "object", ref: o }; }
      return null;
    },
    portrait: function (ctx, look, cx, cy, size, opts) {
      var r = size * 0.42;
      var col = "hsl(" + look.hue + "," + look.sat + "%," + look.light + "%)";
      var col2 = "hsl(" + look.hue2 + "," + look.sat + "%," + (look.light - 12) + "%)";
      ctx.fillStyle = col2;
      if (look.ears) { [-1, 1].forEach(function (s) { ctx.beginPath(); ctx.ellipse(cx + s * r * 0.6, cy - r * 0.85, r * 0.22, r * 0.4, s * 0.4, 0, 7); ctx.fill(); }); }
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, r * look.body, r, 0, 0, 7); ctx.fill();
      if (look.species === "grump") { ctx.fillStyle = col2; for (var i = 0; i < 5; i++) { ctx.beginPath(); var a = -2.6 + i * 0.4; ctx.moveTo(cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9); ctx.lineTo(cx + Math.cos(a + 0.1) * r * 1.4, cy + Math.sin(a + 0.1) * r * 1.4); ctx.lineTo(cx + Math.cos(a + 0.25) * r * 0.9, cy + Math.sin(a + 0.25) * r * 0.9); ctx.fill(); } }
      var er = r * 0.2 * look.eyes;
      ctx.fillStyle = "#fff"; [-1, 1].forEach(function (s) { ctx.beginPath(); ctx.arc(cx + s * r * 0.36, cy - r * 0.15, er, 0, 7); ctx.fill(); });
      ctx.fillStyle = "#1a1a22"; [-1, 1].forEach(function (s) { ctx.beginPath(); ctx.arc(cx + s * r * 0.36, cy - r * 0.12, er * 0.55, 0, 7); ctx.fill(); });
      ctx.strokeStyle = "#1a1a22"; ctx.lineWidth = Math.max(1, r * 0.06); ctx.beginPath(); ctx.arc(cx, cy + r * 0.2, r * 0.18, 0.2, Math.PI - 0.2); ctx.stroke();
    },
    minimap: function (ctx, w, h, g) {
      var rw = w / SB.ROOMS.length;
      SB.ROOMS.forEach(function (r, i) { ctx.fillStyle = r.sky[1]; ctx.fillRect(i * rw, 0, rw, h); ctx.fillStyle = r.ground; ctx.fillRect(i * rw, h * 0.68, rw, h * 0.32); });
      g.creatures.forEach(function (c) { ctx.fillStyle = c.species === "grump" ? "#6b2fa0" : c.id === g.selectedId ? "#c5ff49" : "#fff"; ctx.beginPath(); ctx.arc(c.x / SB.WORLD_W * w, h * 0.6, 2.5, 0, 7); ctx.fill(); });
      var a = SB.Render.toWorld(0, 0).x, b = SB.Render.toWorld(vw(), 0).x;
      ctx.strokeStyle = "#101114"; ctx.lineWidth = 2; ctx.strokeRect(a / SB.WORLD_W * w, 1, (b - a) / SB.WORLD_W * w, h - 2);
    },
    frame: function (g) {
      var dpr = Math.min(2, devicePixelRatio || 1);
      if (view.width !== vw() * dpr) { view.width = vw() * dpr; view.height = vh() * dpr; }
      var ctx = view.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var grd = ctx.createLinearGradient(0, 0, 0, vh()); grd.addColorStop(0, "#8fd3ff"); grd.addColorStop(1, "#e6f7ff");
      ctx.fillStyle = grd; ctx.fillRect(0, 0, vw(), vh());
      var gy = SB.Render.toScreen(0, 470).y;
      ctx.fillStyle = "#6cc35a"; ctx.fillRect(0, gy, vw(), vh() - gy);
      var s = scale();
      objects.forEach(function (o) { var p = SB.Render.toScreen(o.x, o.y); ctx.font = (o.r * 2 * s) + "px serif"; ctx.textAlign = "center"; ctx.fillText(SB.KINDS[o.kind].emoji, p.x, p.y + o.r * s * 0.7); });
      creatures.forEach(function (c) { var p = SB.Render.toScreen(c.x, c.y - 20); SB.Render.portrait(ctx, c.look, p.x, p.y, 60 * s, {}); if (c.id === g.selectedId) { ctx.strokeStyle = "#c5ff49"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(p.x, p.y + 28 * s, 26 * s, 6 * s, 0, 0, 7); ctx.stroke(); } });
      if (g.hand.visible) { var hp = SB.Render.toScreen(g.hand.x, g.hand.y); ctx.font = "30px serif"; ctx.fillText({ grab: "✋", tickle: "🪶", tap: "👆", talk: "💬" }[g.hand.tool], hp.x, hp.y); if (g.hand.saying) { ctx.font = "bold 16px system-ui"; ctx.fillStyle = "#101114"; ctx.fillText(g.hand.saying + "!", hp.x, hp.y - 30); } }
    },
    fx: function () {}
  };
  SB.World = {
    clock: function (g) { var t = g.time, d = Math.floor(t / SB.DAY_LENGTH) + 1, f = (t % SB.DAY_LENGTH) / SB.DAY_LENGTH, m = Math.floor(f * 1440 + 360) % 1440; return { label: "day " + d + " · " + ("0" + Math.floor(m / 60)).slice(-2) + ":" + ("0" + m % 60).slice(-2), night: false }; },
    warmEgg: function (w, g, egg) { SB.Game.note(g, "the egg feels warm. 🥚"); },
    add: function (w, g, kind, x, y) { var o = { id: g.nextId++, kind: kind, noun: SB.KINDS[kind].noun, x: x, y: y, r: SB.KINDS[kind].r }; objects.push(o); return o; }
  };
  SB.Creature = {
    iq: function (c) { return c.species === "grump" ? 23 : 60 + (c.id * 13) % 40; },
    tickle: function (c, g) { SB.bus.emit("tickle", { c: c }); SB.Game.unlock(g, "tickle"); },
    tap: function (c, g) { SB.bus.emit("tap", { c: c }); },
    hear: function (c, w, g, o) { c.vocab[w] = Math.min(1.5, (c.vocab[w] || 0) + 0.35); if (c.vocab[w] >= 1 && !c["_k" + w]) { c["_k" + w] = 1; SB.bus.emit("learnWord", { c: c, word: w }); } }
  };
  SB.Chem = {
    drives: function (ch) { return SB.DRIVES.map(function (d) { return ch[d] || 0; }); },
    top: function (ch) { var bi = 0, d = SB.Chem.drives(ch); for (var i = 1; i < 12; i++) if (d[i] > d[bi]) bi = i; return { i: bi, v: d[bi] }; },
    mood: function (ch) { return ch.health < 0.4 ? "sick" : ch.hunger > 0.7 ? "sad" : "happy"; }
  };
  SB.Brain = {
    explain: function (b, verb) {
      var out = [];
      for (var i = 0; i < b.nIn; i++) { if (!b.x[i]) continue; var v = 0; for (var j = 0; j < b.nHid; j++) v += b.w2[verb * b.nHid + j] * b.w1[j * b.nIn + i] * b.x[i]; out.push({ i: i, label: SB.INPUT_LABELS[i], v: Math.abs(v) * (i === 0 || i === 15 ? 3 : 1) }); }
      return out.sort(function (a, c) { return c.v - a.v; });
    },
    deserialize: function (o) { return fakeBrain(10); }
  };
  SB.Save = {
    save: function () { return true; },
    exportSmol: function (c) { return "SMOL1:" + btoa(c.name + "|" + c.id + "|abcdefghijklmnopqrstuvwxyz0123456789").replace(/=/g, "") + "Zm9vYmFyYmF6cXV4cXV1eHh5enp5eHdhYmNkZWZnaGlqa2xtbm9wcXJzdHV2"; },
    importSmol: function (code) { if (code.indexOf("SMOL1:") !== 0) throw new Error("not a smol code"); return { genome: SB.Genome.random(rng, {}), brain: {}, vocab: { food: 1.2 }, name: "Warpo", gen: 4 }; },
    wipe: function () {}
  };
  SB.Audio = { muted: false, setMuted: function (m) { this.muted = m; }, play: function () {} };
  SB.Game = {
    current: game,
    byId: function (g, id) { for (var i = 0; i < g.creatures.length; i++) if (g.creatures[i].id === id) return g.creatures[i]; for (var j = 0; j < objects.length; j++) if (objects[j].id === id) return objects[j]; return null; },
    select: function (g, id) { g.selectedId = id; SB.bus.emit("select", { c: SB.Game.byId(g, id) }); },
    unlock: function (g, id) { if (g.achievements[id]) return; var a = SB.ACHIEVEMENTS.filter(function (x) { return x.id === id; })[0]; if (!a) return; g.achievements[id] = Date.now(); SB.bus.emit("achievement", { a: a }); },
    note: function (g, t) { SB.bus.emit("note", { text: t }); },
    spawnSmol: function (g, o) { var c = mk("smol", o.name || "Newbie", o.x || 2400, { vocab: o.vocab || {}, gen: o.gen }); g.creatures.push(c); g.family[c.id] = { id: c.id, name: c.name, gen: c.gen, parents: [], kids: [], born: g.time, died: null, look: c.look }; return c; },
    swap: function () { location.reload(); }, newGame: function () { return game; }
  };
  window.__game = game;

  // load ui.js after the stubs exist
  var s = document.createElement("script");
  s.src = "../play/js/ui.js";
  s.onload = function () {
    SB.UI.init(game);
    var last = performance.now();
    function loop(t) {
      var dt = Math.min(0.1, (t - last) / 1000); last = t;
      if (game.speed && !SB.UI.modalOpen) {
        game.time += dt * game.speed;
        // wiggle brains so the viewer animates
        creatures.forEach(function (c) { var b = c.brain; for (var j = 0; j < b.nHid; j++) b.h[j] = Math.tanh(b.h[j] + (Math.random() - 0.5) * 0.08); for (var k = 0; k < b.dw1.length; k++) b.dw1[k] *= 0.98; });
        if (game.hand.sayT > 0) { game.hand.sayT -= dt; if (game.hand.sayT <= 0) game.hand.saying = null; }
      }
      SB.Render.frame(game, dt);
      SB.UI.frame(game, dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__ready = true;
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
