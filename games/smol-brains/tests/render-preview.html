<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#101114;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#info{position:absolute;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:4px}</style></head>
<body><canvas id="view"></canvas><canvas id="ov"></canvas><div id="info"></div>
<script src="../play/js/core.js"></script>
<script src="../play/js/worldgen.js"></script>
<script src="../play/js/gl.js"></script>
<script src="../play/js/meshes.js"></script>
<script src="../play/js/render.js"></script>
<script>
var q = new URLSearchParams(location.search);
var seed = +(q.get("seed") || 42);
var T = SB.WorldGen.generate(seed);
var game = { world: { T: T, time: SB.DAY_LENGTH * (+(q.get("t") || 0.35)), weather: { cloud: +(q.get("cloud") || 0.3), rain: 0, wind: 0.5 }, structures: [], snowCover: +(q.get("snow") || 0), autumn: +(q.get("autumn") || 0) } };
SB.Render.init(document.getElementById("view"), document.getElementById("ov"));
SB.Render.setWorld(game);
var cam = SB.Render.camera;
if (q.get("x")) { cam.x = +q.get("x"); cam.z = +q.get("z"); }
cam.zoom = cam.tZoom = +(q.get("zoom") || 12);
cam.yaw = cam.tYaw = +(q.get("yaw") || 0.4);
var last = performance.now(), frames = 0, acc = 0;
function loop(now) {
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (q.get("spin")) cam.tYaw += dt * 0.2;
  SB.Render.frame(game, dt, 0);
  frames++; acc += dt; if (acc > 1) { document.getElementById("info").textContent = "gen " + T.genMs + "ms  fps " + frames; frames = 0; acc = 0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener("resize", function () { SB.Render.resize(); });
</script></body></html>
