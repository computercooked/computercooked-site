<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="color-scheme" content="dark">
<meta name="description" content="raise tiny creatures with real neural-network brains. teach them words. they will learn the wrong ones.">
<title>smol brains</title>
<link rel="stylesheet" href="style.css">
<style>
  /* inline so the splash paints before style.css arrives */
  html,body{margin:0;height:100%;background:#101114;overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#101114;color:#f5f3ed;font:600 15px system-ui,sans-serif;z-index:999;transition:opacity .4s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .egg{width:54px;height:68px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:#f5f3ed;box-shadow:inset -8px -10px 0 rgba(181,154,255,.45);animation:sbwob 1s ease-in-out infinite}
  #splash b{color:#c5ff49}
  @keyframes sbwob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @media (prefers-reduced-motion:reduce){#splash .egg{animation:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="the valley, where the smols live"></canvas>
<div id="ui"></div>
<div id="splash" role="status"><div class="egg"></div><div><b>smol brains</b> is loading. barely.</div></div>
<noscript><p style="color:#f5f3ed;padding:24px;font-family:system-ui">smol brains needs javascript. the smols are made of it.</p></noscript>
<script src="/games/cc-sdk.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/genome.js"></script>
<script defer src="js/brain.js"></script>
<script defer src="js/chemistry.js"></script>
<script defer src="js/world.js"></script>
<script defer src="js/creature.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/save.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
