<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>desktop jam · computer cooked games</title>
<meta name="description" content="tap desktop icons to slide them off the screen. if something's in the way: bonk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101114'/%3E%3Crect x='2' y='4' width='12' height='9' fill='%23C5FF49'/%3E%3Crect x='2' y='3' width='5' height='2' fill='%23B59AFF'/%3E%3C/svg%3E">
<style>
  :root { --carbon: #101114; --lime: #C5FF49; --lilac: #B59AFF; --paper: #F5F3ED; --panel: #1a1b20; --line: #33353d; --dim: #77756e; --red: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--carbon); color: var(--paper); overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; border: 0; cursor: pointer; color: var(--carbon); text-transform: lowercase; }
  .hud { flex: none; height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
  .crash { width: 44px; height: 44px; flex: none; background: url(crash.png) 0 0 / 300% 100% no-repeat; image-rendering: pixelated; }
  .crash.hit { background-position: 50% 0; } .crash.cooked { background-position: 100% 0; }
  .hud .mid { flex: 1; min-width: 0; }
  #lvl { font-weight: 900; font-size: clamp(12px, 3.8vw, 16px); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: 11px; color: var(--dim); margin-top: 2px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .lives { display: inline-flex; gap: 3px; }
  .lives i { width: 10px; height: 10px; background: var(--lime); display: block; }
  .lives i.gone { background: var(--line); }
  .ib { width: 40px; height: 40px; background: var(--panel); color: var(--paper); font-size: 18px; box-shadow: inset 0 0 0 2px var(--line); flex: none; }
  .ib:active { transform: translateY(2px); }
  #board { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; cursor: pointer; }
  #cap { flex: none; height: 40px; text-align: center; font-size: 12px; line-height: 1.35; color: var(--dim); padding: 4px 12px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #cap b { color: var(--lime); font-weight: 800; } #cap em { color: var(--lilac); font-style: normal; font-weight: 800; }

  .ov { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(16,17,20,.82); padding: 16px; }
  .ov.on { display: flex; }
  .card { width: min(100%, 380px); background: var(--panel); box-shadow: inset 0 0 0 2px var(--lime), 0 6px 0 #050507; padding: 20px 18px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; animation: drop .32s cubic-bezier(.2,1.5,.4,1); }
  @keyframes drop { from { transform: translateY(-24px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
  h1, h2 { margin: 0; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
  h1 { font-size: 46px; color: var(--lime); text-shadow: 4px 4px 0 #5e4a9e; }
  h2 { font-size: 28px; color: var(--lime); }
  h2.bad { color: var(--lilac); }
  .p { font-size: 13px; color: #c9c6bd; line-height: 1.5; margin: 0; }
  .btn { background: var(--lime); padding: 12px 22px; font-weight: 900; font-size: 17px; min-height: 48px; box-shadow: 0 4px 0 #6b8f1c; }
  .btn.alt { background: var(--lilac); box-shadow: 0 4px 0 #5e4a9e; }
  .btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px var(--line); }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn.big { font-size: 22px; padding: 16px 40px; min-height: 60px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .bigcrash { width: 128px; height: 128px; background: url(crash.png) 0 0 / 300% 100% no-repeat; image-rendering: pixelated; animation: bob 2.4s ease-in-out infinite; }
  .bigcrash.cooked { background-position: 100% 0; } .bigcrash.hit { background-position: 50% 0; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .credit { font-size: 11px; letter-spacing: .14em; color: var(--dim); font-weight: 800; }
  .credit b { color: var(--lime); }
  .stars { font-size: 26px; letter-spacing: 6px; color: var(--lime); min-height: 30px; }
  .stars .off { color: var(--line); }
  .stars:empty { display: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
  .stat { background: #22242a; padding: 8px 2px; } .stat b { display: block; font-size: 18px; } .stat span { font-size: 10px; color: var(--dim); letter-spacing: .08em; }
  .tog { font-size: 12px; background: transparent; color: var(--dim); box-shadow: inset 0 0 0 2px var(--line); padding: 8px 12px; min-height: 40px; }
  .tog.on { color: var(--carbon); background: #ff8a1f; box-shadow: none; }
  #levels .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
  #levels .grid button { background: #22242a; color: var(--paper); min-height: 48px; font-weight: 900; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #levels .grid button small { font-size: 9px; color: var(--lime); letter-spacing: 1px; }
  #levels .grid button.lock { color: var(--line); cursor: default; }
  #levels .grid button.cur { box-shadow: inset 0 0 0 2px var(--lime); }
  #levels .grid .wh { grid-column: 1 / -1; text-align: left; font-size: 11px; font-weight: 800; color: var(--lilac); letter-spacing: .08em; margin-top: 6px; }
  #levels .card { max-height: calc(100% - 8px); overflow-y: auto; }
  #toast { position: absolute; left: 50%; top: 62px; transform: translate(-50%, 10px); opacity: 0; z-index: 9; background: var(--panel); box-shadow: inset 0 0 0 2px var(--lime);
    padding: 8px 14px; font-size: 13px; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="/games/cc-sdk.js" defer></script>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="crash" id="crash"></div>
    <div class="mid"><div id="lvl">level 1</div><div id="sub"><span class="lives" id="lives"></span><span id="left"></span></div></div>
    <button class="ib" id="bRestart" aria-label="restart level">&#8635;</button>
    <button class="ib" id="bMute" aria-label="sound">&#9834;</button>
    <button class="ib" id="bMenu" aria-label="menu">&#9776;</button>
  </div>
  <canvas id="board"></canvas>
  <div id="cap"></div>
</div>

<div class="ov on" id="title">
  <div class="card">
    <div class="bigcrash" id="titleCrash"></div>
    <h1>desktop jam</h1>
    <p class="p">tap an icon and it slides off in its arrow's direction.<br>if something's in the way: <b style="color:var(--lilac)">bonk</b>. three bonks and crash crashes. 5 worlds, 50 desktops.</p>
    <button class="btn big" id="bPlay">play</button>
    <div class="row">
      <button class="btn alt" id="bDaily">daily desktop</button>
      <button class="btn ghost" id="bLevels">levels</button>
    </div>
    <div class="row"><button class="tog" id="bSpooky">spooky mode</button></div>
    <div class="credit">a <b>computer cooked games</b> joint</div>
  </div>
</div>

<div class="ov" id="levels">
  <div class="card">
    <h2>levels</h2>
    <div class="grid" id="lvGrid"></div>
    <button class="btn ghost" id="bLvBack">back</button>
  </div>
</div>

<div class="ov" id="end">
  <div class="card">
    <div class="bigcrash" id="endCrash"></div>
    <h2 id="endTitle">desktop cleared</h2>
    <div class="stars" id="endStars"></div>
    <p class="p" id="endMsg"></p>
    <div class="stats" id="endStats"></div>
    <div class="row">
      <button class="btn" id="bNext">next</button>
      <button class="btn alt" id="bShare">share</button>
    </div>
    <button class="btn ghost" id="bEndMenu">menu</button>
  </div>
</div>

<div class="ov" id="pause">
  <div class="card">
    <h2>paused</h2>
    <p class="p">crash is staring at the wall. take your time.</p>
    <button class="btn big" id="bResume">resume</button>
  </div>
</div>

<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
