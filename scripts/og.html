<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 800; src: url("../assets/fonts/jetbrains-mono-latin-800-normal.woff2") format("woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #101114;
    background-image:
      radial-gradient(ellipse 70% 60% at 20% 0%, rgba(197,255,73,.14), transparent 70%),
      radial-gradient(ellipse 60% 60% at 100% 100%, rgba(181,154,255,.14), transparent 70%);
    font-family: "JetBrains Mono", monospace; font-weight: 800;
    display: flex; align-items: center; gap: 64px; padding: 0 88px; box-sizing: border-box;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
  }
  img { width: 300px; height: 300px; flex: none; filter: drop-shadow(0 16px 48px rgba(197,255,73,.25)); }
  h1 { margin: 0; color: #C5FF49; font-size: 132px; line-height: .88; letter-spacing: -.045em; text-shadow: 6px 0 0 rgba(181,154,255,.55); }
  p { margin: 30px 0 0; color: #F5F3ED; font-size: 34px; letter-spacing: -.02em; }
  .url { position: absolute; right: 48px; bottom: 36px; color: #B59AFF; font-size: 24px; }
</style>
</head>
<body>
  <img src="../assets/logo.svg" alt="">
  <div>
    <h1>COMPUTER<br>COOKED</h1>
    <p>the computer is not<br>handling it well.</p>
  </div>
  <div class="url">computercooked.com</div>
</body>
</html>
